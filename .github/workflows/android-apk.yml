name: Android APK

on:
  push:
    branches:
      - android-apk-setup
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'HTTPS base URL for the deployed Sukhan AI Express API (e.g. https://api.example.com). Leave blank only for a UI/package smoke test.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.SUKHAN_API_BASE_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Validate API configuration
        shell: bash
        run: |
          if [ -n "${VITE_API_BASE_URL}" ]; then
            case "${VITE_API_BASE_URL}" in
              https://*) echo "HTTPS API base URL configured." ;;
              *) echo "::error::VITE_API_BASE_URL must use HTTPS."; exit 1 ;;
            esac
          else
            echo "::warning::No API base URL configured. The APK can be installed for UI testing, but AI/server API calls will not work until VITE_API_BASE_URL is configured."
          fi

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sukhan-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
