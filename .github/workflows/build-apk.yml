name: Build Sukhan AI Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag for the public Android release (for example v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Sukhan AI Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # This action expects package names separated by spaces.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Normalize package.json for public npm registry & ensure Firebase config
        run: |
          if [ -f "scripts/prepare-apk-build.mjs" ]; then
            node scripts/prepare-apk-build.mjs
          else
            rm -f bun.lock package-lock.json yarn.lock pnpm-lock.yaml
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              pkg.dependencies = {
                "@capacitor-community/speech-recognition": "^7.0.1",
                "@capacitor-community/text-to-speech": "^6.0.0",
                "@capacitor/android": "^7.0.0",
                "@capacitor/cli": "^7.0.0",
                "@capacitor/core": "^7.0.0",
                "@fontsource/cormorant-garamond": "^5.1.0",
                "@fontsource/noto-naskh-arabic": "^5.1.0",
                "@fontsource/noto-serif-devanagari": "^5.1.0",
                "@fontsource/plus-jakarta-sans": "^5.1.0",
                "@google/genai": "^3.6.1",
                "@tailwindcss/vite": "^4.0.0",
                "@vitejs/plugin-react": "^4.3.0",
                "dotenv": "^16.4.0",
                "express": "^4.21.0",
                "firebase": "^11.0.0",
                "lucide-react": "^0.460.0",
                "motion": "^12.0.0",
                "react": "^19.0.0",
                "react-dom": "^19.0.0",
                "vite": "^6.0.0",
                "ws": "^8.18.0"
              };
              pkg.devDependencies = {
                "@types/express": "^4.17.21",
                "@types/node": "^22.0.0",
                "@types/react": "^19.0.0",
                "@types/react-dom": "^19.0.0",
                "@types/ws": "^8.18.0",
                "autoprefixer": "^10.4.20",
                "esbuild": "^0.24.0",
                "tailwindcss": "^4.0.0",
                "tsx": "^4.19.0",
                "typescript": "^5.7.0"
              };
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n", "utf8");
              if (!fs.existsSync("firebase-applet-config.json")) {
                fs.writeFileSync("firebase-applet-config.json", JSON.stringify({
                  projectId: "storied-hawk-tn50x",
                  appId: "1:117334778546:web:495089c9d869f0a8149fab",
                  apiKey: process.env.VITE_FIREBASE_API_KEY || "AIzaSyDpvVm1a7-UmjL7m0Dj48-C2V1sq6AW5fc",
                  authDomain: "storied-hawk-tn50x.firebaseapp.com",
                  firestoreDatabaseId: "ai-studio-sukhanai-4d175da9-2da9-4f4a-8c4a-b0bd756154f2",
                  storageBucket: "storied-hawk-tn50x.firebasestorage.app",
                  messagingSenderId: "117334778546",
                  measurementId: ""
                }, null, 2) + "\n", "utf8");
              }
            '
          fi

      - name: Install dependencies from public npm
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build production web bundle (dist)
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || secrets.GEMINI_API_KEY || vars.VITE_GEMINI_API_KEY || vars.GEMINI_API_KEY || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY || vars.GEMINI_API_KEY || vars.VITE_GEMINI_API_KEY || '' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL || secrets.SUKHAN_API_BASE_URL || vars.SUKHAN_API_BASE_URL || '' }}
        run: |
          if [ -n "$VITE_API_BASE_URL" ]; then
            echo "[Sukhan APK] Live Voice mode: Remote Backend Server (VITE_API_BASE_URL configured)"
          elif [ -n "$VITE_GEMINI_API_KEY" ]; then
            echo "[Sukhan APK] Live Voice mode: Standalone Direct Gemini Live (GEMINI_API_KEY configured)"
          else
            echo "::warning::Neither GEMINI_API_KEY nor VITE_API_BASE_URL secret is set in GitHub Actions. Add GEMINI_API_KEY in GitHub Repo Settings > Secrets and variables > Actions to enable Live Voice in the standalone APK."
          fi
          npm run build

      - name: Initialize & sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Sukhan AI launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          RES="android/app/src/main/res"
          for entry in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${entry%%:*}"
            size="${entry##*:}"
            mkdir -p "$RES/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" public/favicon.svg > "/tmp/ic_launcher.png"
            cp "/tmp/ic_launcher.png" "$RES/mipmap-$density/ic_launcher.png"
            cp "/tmp/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done
          # Remove adaptive-icon XML so Android uses the same shared artwork at every density.
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Configure AndroidManifest permissions, ProGuard/R8 & Cleartext Traffic
        run: |
          if [ -f "scripts/patch-android-manifest.mjs" ]; then
            node scripts/patch-android-manifest.mjs
          else
            node -e '
              const fs = require("fs");
              const path = require("path");
              const xmlDir = "android/app/src/main/res/xml";
              fs.mkdirSync(xmlDir, { recursive: true });
              fs.writeFileSync(path.join(xmlDir, "network_security_config.xml"), `<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n    <base-config cleartextTrafficPermitted="true">\n        <trust-anchors>\n            <certificates src="system" />\n            <certificates src="user" />\n        </trust-anchors>\n    </base-config>\n</network-security-config>\n`, "utf8");
              const p = "android/app/src/main/AndroidManifest.xml";
              if (fs.existsSync(p)) {
                let xml = fs.readFileSync(p, "utf8");
                xml = xml.replace(/\s*<!--\s*Permissions\s*-->/gi, "");
                xml = xml.replace(/\s*<uses-permission\s+android:name="android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|RECORD_AUDIO|MODIFY_AUDIO_SETTINGS)"\s*\/>/g, "");
                xml = xml.replace("<application", "    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n\n    <application");
                if (!xml.includes("android:usesCleartextTraffic")) {
                  xml = xml.replace("<application", "<application\n        android:usesCleartextTraffic=\"true\"");
                }
                if (!xml.includes("android:networkSecurityConfig")) {
                  xml = xml.replace("<application", "<application\n        android:networkSecurityConfig=\"@xml/network_security_config\"");
                }
                if (!xml.includes("android:windowSoftInputMode")) {
                  xml = xml.replace("<activity", "<activity\n            android:windowSoftInputMode=\"adjustResize\"");
                }
                fs.writeFileSync(p, xml, "utf8");
              }
              const gPath = "android/app/build.gradle";
              if (fs.existsSync(gPath)) {
                let g = fs.readFileSync(gPath, "utf8");
                if (!g.includes("shrinkResources false")) {
                  g = g.replace(/buildTypes\s*\{\s*release\s*\{[\s\S]*?\}\s*\}/m, `buildTypes {\n        debug {\n            minifyEnabled false\n            shrinkResources false\n        }\n        release {\n            minifyEnabled false\n            shrinkResources false\n            signingConfig signingConfigs.debug\n            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"\n        }\n    }`);
                  fs.writeFileSync(gPath, g, "utf8");
                }
              }
              const wPath = "android/gradle/wrapper/gradle-wrapper.properties";
              if (fs.existsSync(wPath)) {
                let w = fs.readFileSync(wPath, "utf8");
                w = w.replace("networkTimeout=10000", "networkTimeout=120000").replace("-all.zip", "-bin.zip");
                fs.writeFileSync(wPath, w, "utf8");
              }
            '
          fi

      - name: Build Android Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare installable Sukhan-AI.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Sukhan-AI.apk
          # APK files are ZIP containers; verify the archive before publishing it.
          unzip -t ./Sukhan-AI.apk
          test -s ./Sukhan-AI.apk
          sha256sum ./Sukhan-AI.apk
          ls -lh ./Sukhan-AI.apk

      - name: Upload Sukhan-AI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sukhan-AI-Android-APK
          # Publish one clearly named APK, not two duplicate copies in the artifact ZIP.
          path: ./Sukhan-AI.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Sukhan AI ${{ inputs.release_tag }} (Android)
          body: |
            ## Sukhan AI for Android

            Install the Sukhan AI Android app using the attached APK.

            - Package: `com.sukhan.ai`
            - File: `Sukhan-AI.apk`
            - Build: Android APK generated by GitHub Actions

            On Android, download the APK, open it, and allow your browser or file manager to install apps when prompted.
          files: ./Sukhan-AI.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
