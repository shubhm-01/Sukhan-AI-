name: Build Sukhan AI Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Sukhan AI Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Normalize package.json for public npm registry & ensure Firebase config
        run: |
          rm -f bun.lock package-lock.json
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies = {
              "@capacitor/android": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "@fontsource/cormorant-garamond": "^5.1.0",
              "@fontsource/noto-naskh-arabic": "^5.1.0",
              "@fontsource/noto-serif-devanagari": "^5.1.0",
              "@fontsource/plus-jakarta-sans": "^5.1.0",
              "@google/genai": "^1.0.0",
              "@tailwindcss/vite": "^4.0.0",
              "@vitejs/plugin-react": "^4.3.0",
              "dotenv": "^16.4.0",
              "express": "^4.21.0",
              "firebase": "^11.0.0",
              "lucide-react": "^0.460.0",
              "motion": "^12.0.0",
              "react": "^19.0.0",
              "react-dom": "^19.0.0",
              "vite": "^6.0.0"
            };
            pkg.devDependencies = {
              "@types/express": "^4.17.21",
              "@types/node": "^22.0.0",
              "@types/react": "^19.0.0",
              "@types/react-dom": "^19.0.0",
              "autoprefixer": "^10.4.20",
              "esbuild": "^0.24.0",
              "tailwindcss": "^4.0.0",
              "tsx": "^4.19.0",
              "typescript": "^5.7.0"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n", "utf8");

            if (!fs.existsSync("firebase-applet-config.json")) {
              const fbConfig = {
                projectId: "ai-studio-sukhanai",
                appId: "1:1066844348486:web:81cf9ff24d07d92be4c3f9",
                apiKey: process.env.VITE_FIREBASE_API_KEY || "AIzaSyDummyKeyForBuild",
                authDomain: "ai-studio-sukhanai.firebaseapp.com",
                firestoreDatabaseId: "ai-studio-sukhanai-4d175da9-2da9-4f4a-8c4a-b0bd756154f2",
                storageBucket: "ai-studio-sukhanai.firebasestorage.app",
                messagingSenderId: "1066844348486",
                measurementId: ""
              };
              fs.writeFileSync("firebase-applet-config.json", JSON.stringify(fbConfig, null, 2) + "\n", "utf8");
            }
          '

      - name: Install dependencies from public npm
        run: |
          npm install --legacy-peer-deps

      - name: Build production web bundle (dist)
        env:
          VITE_API_BASE_URL: ${{ vars.SUKHAN_API_BASE_URL }}
        run: |
          if [[ "${VITE_API_BASE_URL}" != https://* ]]; then
            echo "::error::Set the repository Actions variable SUKHAN_API_BASE_URL to the HTTPS URL of the deployed Sukhan AI backend before building an APK."
            exit 1
          fi
          npm run build

      - name: Initialize & sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure AndroidManifest permissions, cleartext traffic & keyboard resize
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            node -e '
              const fs = require("fs");
              const p = "android/app/src/main/AndroidManifest.xml";
              let xml = fs.readFileSync(p, "utf8");
              if (!xml.includes("android:usesCleartextTraffic")) {
                xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
              }
              if (!xml.includes("android:windowSoftInputMode")) {
                xml = xml.replace("<activity", "<activity android:windowSoftInputMode=\"adjustResize\"");
              }
              if (!xml.includes("android.permission.INTERNET")) {
                xml = xml.replace("</manifest>", "    <uses-permission android:name=\"android.permission.INTERNET\" />\n</manifest>");
              }
              fs.writeFileSync(p, xml, "utf8");
            '
          fi

      - name: Build Android Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare installable Sukhan-AI.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Sukhan-AI.apk
          ls -lh ./Sukhan-AI.apk

      - name: Upload Sukhan-AI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sukhan-AI-Android-APK
          path: |
            ./Sukhan-AI.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
